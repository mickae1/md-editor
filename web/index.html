<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mdEditor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23191919'/%3E%3Cpath d='M6 23V9h3l4 5 4-5h3v14h-3v-9l-4 5-4-5v9z' fill='%23c4a744'/%3E%3Cpath d='M23 9h3v9h3l-4.5 5-4.5-5h3z' fill='%23b4b4b4'/%3E%3C/svg%3E">
  <style>
    /* Loading overlay, shown before any script runs (src/loading.ts removes it). */
    #loading { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
      background: var(--bg, #191919); color: var(--fg, #b4b4b4); font: 13px 'Segoe UI', system-ui, sans-serif;
      opacity: 1; transition: opacity .15s ease-out; cursor: progress; }
    #loading.hiding { opacity: 0; pointer-events: none; }
    #loading.failed { cursor: default; }
    #loading .loading-box { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; padding: 0 24px; text-align: center; }
    #loading .loading-name { font-size: 20px; font-weight: 500; color: var(--fg-strong, #e0e0e0); letter-spacing: .3px; }
    #loading .loading-spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--border-strong, #444);
      border-top-color: var(--accent, #c4a744); animation: loading-spin .8s linear infinite; }
    #loading.failed .loading-spinner { display: none; }
    #loading .loading-text { min-height: 1.4em; color: var(--fg-dim, #7c7c7c); }
    #loading .loading-error p { color: var(--danger, #ff5252); white-space: pre-wrap; margin: 0 0 12px; }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="loading-box"><div class="loading-name">mdEditor</div><div class="loading-spinner"></div><div class="loading-text"></div></div></div>
  <div id="app"></div>
  <script type="module" src="/src/boot.ts"></script>
</body>
</html>
